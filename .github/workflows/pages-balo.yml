name: Deploy BALO Viewer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - BALO.html
      - .github/workflows/pages-balo.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp BALO.html _site/BALO.html
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>BALO Viewer</title>
              <meta http-equiv="refresh" content="0; url=./BALO.html">
            </head>
            <body>
              <p>Redirecting to <a href="./BALO.html">BALO.html</a>...</p>
            </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
